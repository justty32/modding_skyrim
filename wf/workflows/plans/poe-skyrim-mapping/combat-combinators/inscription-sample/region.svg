<title id="title">術師通用與刻印樣板的真實PoE節點位置</title>
<desc id="desc">綠框61308為H0原生附印、40927為IA4斷咒，僅hidden實驗probe。其他虛線規則pending不可購；青色普通、紫色通用、灰色保護或外接。規則前置在各點提示，圖連線與規則前置是AND。座標及邊來自3.29.1原圖，未改拓撲。</desc>
<rect x="-6547.44" y="-4756.152191264833" width="2261.54" height="3008.5821912648335" fill="#111827"/>
<text x="-6497.44" y="-4712" fill="#f8fafc" font-family="sans-serif" font-size="26">綠框：H0／IA4 hidden probe；虛線青／紫：pending；實心青：普通；灰：保護／外接</text>
<text x="-6497.44" y="-4669" fill="#cbd5e1" font-family="sans-serif" font-size="24">正常模式關閉刻印；尚未live／未有可見印；線是原圖連線，前置另需AND。</text>
