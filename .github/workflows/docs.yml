name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Check parent-repo Markdown links
        run: python scripts/check_markdown_links.py --skip-symlinks
