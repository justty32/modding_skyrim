name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check parent-repo Markdown links
        # wu-2026-08-31/backup/ 是 WAIT_USER 系列檔的備份副本，其相對連結以原始位置為準；
        # 詳見 agentctl/handoffs/wu-2026-08-31/README.md。修連結會破壞備份的逐字原樣。
        # inbox 的 originals 也保留寄件時的原文與路徑，不當作現役文件維護。
        # 公開 CI 不取得私人 submodule；本機完整 checkout 仍以嚴格模式檢查跨 repo 連結。
        run: python tools/check_markdown_links.py --skip-uninitialized-submodules --skip-symlinks --exclude-source 'agentctl/handoffs/wu-2026-08-31/backup/' --exclude-source 'agentctl/inbox/done/*/originals/*'
      - name: Run wf kernel tool tests
        run: python -m unittest discover -s wf/tools -p 'test_*.py'
      # 下面這步要私人 submodule（agentctl 等）才有意義：code-map 檢查會逐支看
      # agentctl/tools 的腳本。公開 CI 不取得私人 submodule，所以只在 checkout
      # 帶到 agentctl 時才跑（本機完整 checkout 一律要 exit 0）。工具還沒有
      # --skip-uninitialized-submodules。
      # wf-lint 不在 CI：2026-10-26 起改為可選（照上游 368468a），大量搬檔後
      # 擔心連結壞掉或使用者要求才手動跑，見 wf/workflows/testing.md。
      - name: Check code-map coverage
        if: hashFiles('agentctl/tools/README.md') != ''
        run: python3 tools/check_code_map_coverage.py
