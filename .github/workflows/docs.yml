name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check parent-repo Markdown links
        # wu-2026-08-31/backup/ 是 WAIT_USER 系列檔的備份副本，其相對連結以原始位置為準；
        # 詳見 agentctl/handoffs/wu-2026-08-31/README.md。修連結會破壞備份的逐字原樣。
        run: python tools/check_markdown_links.py --skip-symlinks --exclude-source 'agentctl/handoffs/wu-2026-08-31/backup/'
